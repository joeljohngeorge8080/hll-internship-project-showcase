name: Backend CI

on:
  push:
    branches: [main, master, master2]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values only, so the app's required-settings validation and a
      # bare `import app.main` succeed without a real database or secrets.
      DATABASE_URL: sqlite:///./ci.db
      SECRET_KEY: ci-placeholder-secret-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt ruff

      # Non-blocking: ~130 pre-existing ruff errors (mostly E501 line-length
      # over ruff's default 88 chars). Surfacing them without failing the
      # build until that debt is paid down.
      - name: Lint (report only)
        run: ruff check .
        continue-on-error: true

      - name: Import sanity check
        run: python -c "import app.main"
