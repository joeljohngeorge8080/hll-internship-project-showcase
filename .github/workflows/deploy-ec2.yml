name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - "Deploy Backend to Docker Hub"
      - "Deploy Frontend to Docker Hub"
    types: [completed]
    branches: [master2]

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest images, restart stack, and verify health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/hma-iems
            docker compose pull
            docker compose up -d
            docker image prune -f

            for i in $(seq 1 10); do
              if curl -sf http://localhost:3000/health; then
                echo "Health check passed"
                exit 0
              fi
              echo "Waiting for backend to come up... ($i/10)"
              sleep 5
            done
            echo "Health check failed after redeploy" >&2
            exit 1
