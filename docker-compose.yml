services:
  # Backend's own dedicated Postgres (matches render.yaml's hma-iems-db in
  # production). The backend bootstraps its schema itself via create_tables()
  # in app/main.py on startup — no migrations to run, just point
  # backend/.env's DATABASE_URL at this and restart the backend.
  postgres:
    image: postgres:16-alpine
    container_name: hma-postgres
    environment:
      POSTGRES_DB: hma_iems
      POSTGRES_USER: hma
      POSTGRES_PASSWORD: hma_dev_password
    ports:
      # Host 5433, not 5432 — a system Postgres already owns 5432 on this
      # machine.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hma']
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      # Secrets (DB password, AWS keys, JWT secret) live only in this file on
      # the host — it's read at container start, never baked into the image.
      - ./backend/.env
    environment:
      # Inside Docker network, reference postgres service by name, not localhost
      DATABASE_URL: postgresql://hma:hma_dev_password@postgres:5432/hma_iems
    depends_on:
      - postgres
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./hma-template/emsv1
      args:
        # False by default — the dev quick-login bypass (instant Admin/CEO/HR
        # access with no real auth) must never ship in a real deployment.
        # Only flip this for a deliberately internal/demo build.
        VITE_DEV_LOGIN: "false"
        # Supabase anon key and the Google OAuth client ID are meant to be
        # public (RLS/origin-restricted respectively) — safe as defaults here,
        # override by exporting the same-named var before `docker compose build`
        # if deploying against a different Supabase project or Google client.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://YOUR-PROJECT-REF.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
