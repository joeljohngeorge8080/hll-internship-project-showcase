# Static-only nginx config for the showcase build (EC2 host, no backend).
# Installed to /etc/nginx/sites-available/hma-ems by .github/workflows/deploy-ec2-static.yml.
#
# HTTPS: the Let's Encrypt certificate must already exist on the host before the
# first deploy (see README "HTTPS setup"). Until then `nginx -t` fails and the
# workflow restores the previous config instead of going live.

# Port 80: serve Let's Encrypt renewals, redirect everything else to HTTPS.
server {
    listen 80;
    server_name hll-internship-project.joelz.site;

    # certbot --webroot renewals write challenge files here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name hll-internship-project.joelz.site;

    ssl_certificate     /etc/letsencrypt/live/hll-internship-project.joelz.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hll-internship-project.joelz.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/hma-ems;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # One day for now: HSTS is hard to undo, so raise this (e.g. 31536000) once
    # HTTPS has proven stable.
    add_header Strict-Transport-Security "max-age=86400" always;

    # Cache headers use `expires`, not add_header: any add_header inside a
    # location stops the server-level security headers above being inherited.

    # Hashed Vite bundles can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deploys are picked up.
    location = /index.html {
        expires -1;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
