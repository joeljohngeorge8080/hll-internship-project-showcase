# Static-only nginx config for the showcase build (EC2 host, no backend).
# Installed to /etc/nginx/sites-available/hma-ems by .github/workflows/deploy-ec2-static.yml.

server {
    listen 80;
    server_name ems.joelz.site;

    root /var/www/hma-ems;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed Vite bundles can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
